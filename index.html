<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>우주 탐사 퀴즈</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f7ff;
      --card: #ffffff;
      --text: #1e2430;
      --muted: #5f6b7a;
      --accent-1: #3b82f6;
      --accent-2: #8b5cf6;
      --progress-bg: #dfe7ff;
      --correct-bg: #d1fae5;
      --correct-border: #10b981;
      --wrong-bg: #fee2e2;
      --wrong-border: #ef4444;
      --display-bg: #eef4ff;
      --display-border: #9ab3ff;
      --display-grid: rgba(59, 130, 246, 0.18);
      --display-glow: rgba(59, 130, 246, 0.2);
      --shadow: 0 16px 35px rgba(29, 51, 84, 0.16);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d111a;
        --card: #141b29;
        --text: #e8edf8;
        --muted: #a5b4ca;
        --accent-1: #60a5fa;
        --accent-2: #a78bfa;
        --progress-bg: #29354f;
        --correct-bg: #102a20;
        --correct-border: #34d399;
        --wrong-bg: #32181b;
        --wrong-border: #f87171;
        --display-bg: #111d31;
        --display-border: #4e6cc3;
        --display-grid: rgba(96, 165, 250, 0.2);
        --display-glow: rgba(96, 165, 250, 0.25);
        --shadow: 0 18px 38px rgba(0, 0, 0, 0.45);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 14px;
      font-family: "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.45;
      color: var(--text);
      background:
        radial-gradient(1200px 500px at 10% -10%, rgba(99, 102, 241, 0.2), transparent 55%),
        radial-gradient(900px 420px at 95% 0%, rgba(56, 189, 248, 0.12), transparent 60%),
        var(--bg);
    }

    .quiz-shell {
      width: min(100%, 560px);
      background: var(--card);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
      border: 1px solid color-mix(in oklab, var(--accent-1) 15%, transparent);
    }

    .header {
      padding: 18px 20px 14px;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      color: white;
    }

    .title-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .title-row h1 {
      margin: 0;
      font-size: clamp(1.1rem, 2.4vw, 1.35rem);
      letter-spacing: 0.02em;
    }

    .score {
      font-weight: 700;
      font-size: 0.95rem;
      opacity: 0.98;
      white-space: nowrap;
    }

    .progress-wrap {
      background: rgba(255, 255, 255, 0.28);
      border-radius: 999px;
      height: 10px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, #22d3ee, #d946ef);
      transition: width 0.35s ease;
    }

    .content {
      padding: 22px 20px 20px;
    }

    .meta {
      color: var(--muted);
      font-size: 0.92rem;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .question {
      position: relative;
      margin: 0 0 14px;
      font-size: 1.08rem;
      font-weight: 700;
      line-height: 1.55;
      letter-spacing: 0.01em;
      padding: 14px 14px 14px 44px;
      border-radius: 12px;
      border: 1px solid var(--display-border);
      background:
        linear-gradient(180deg, color-mix(in oklab, var(--display-bg) 85%, white 15%), var(--display-bg)),
        repeating-linear-gradient(
          0deg,
          transparent 0 8px,
          var(--display-grid) 8px 9px
        );
      box-shadow:
        inset 0 0 0 1px color-mix(in oklab, var(--display-border) 35%, transparent),
        0 0 0 3px color-mix(in oklab, var(--display-glow) 55%, transparent);
      text-shadow: 0 1px 0 color-mix(in oklab, var(--card) 60%, transparent);
    }

    .question::before {
      content: "";
      position: absolute;
      left: 15px;
      top: 50%;
      width: 12px;
      height: 12px;
      transform: translateY(-50%);
      border-radius: 50%;
      background: #22c55e;
      box-shadow:
        0 0 0 2px color-mix(in oklab, var(--display-bg) 75%, transparent),
        0 0 10px rgba(34, 197, 94, 0.65);
    }

    .question::after {
      content: "MISSION FEED";
      position: absolute;
      top: -10px;
      right: 10px;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      padding: 2px 7px;
      border-radius: 999px;
      color: color-mix(in oklab, var(--accent-1) 82%, var(--text));
      background: color-mix(in oklab, var(--card) 85%, var(--accent-1) 15%);
      border: 1px solid color-mix(in oklab, var(--accent-1) 35%, transparent);
    }

    .answers {
      display: grid;
      gap: 10px;
    }

    .answer-btn {
      border: 1px solid color-mix(in oklab, var(--accent-1) 25%, transparent);
      background: color-mix(in oklab, var(--card) 90%, var(--accent-1) 10%);
      color: var(--text);
      border-radius: 12px;
      padding: 12px 13px;
      text-align: left;
      font: inherit;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.2s ease, border-color 0.2s ease;
    }

    .answer-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: color-mix(in oklab, var(--accent-2) 45%, transparent);
    }

    .answer-btn:disabled {
      cursor: default;
      opacity: 0.88;
    }

    .answer-btn.correct {
      background: var(--correct-bg);
      border-color: var(--correct-border);
      animation: pop 320ms ease;
    }

    .answer-btn.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong-border);
      animation: shake 360ms ease;
    }

    .feedback {
      margin-top: 14px;
      min-height: 24px;
      font-weight: 700;
      transition: color 0.2s ease;
    }

    .feedback.correct {
      color: var(--correct-border);
    }

    .feedback.wrong {
      color: var(--wrong-border);
    }

    .next-row {
      margin-top: 16px;
      display: flex;
      justify-content: flex-end;
    }

    .next-btn, .restart-btn {
      border: none;
      border-radius: 12px;
      padding: 10px 16px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      color: white;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      transition: transform 0.15s ease, filter 0.2s ease;
    }

    .next-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .next-btn:hover:not(:disabled), .restart-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.04);
    }

    .results {
      text-align: center;
      padding: 8px 2px 2px;
    }

    .results h2 {
      margin: 0 0 8px;
      font-size: 1.35rem;
    }

    .emoji {
      font-size: 3rem;
      margin: 8px 0 6px;
    }

    .result-line {
      margin: 0 0 14px;
      color: var(--muted);
      font-weight: 600;
    }

    .hidden {
      display: none !important;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-7px); }
      40% { transform: translateX(7px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(5px); }
    }

    @keyframes pop {
      0% { transform: scale(0.98); }
      60% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <main class="quiz-shell" aria-live="polite">
    <header class="header">
      <div class="title-row">
        <h1>🚀 우주 탐사 퀴즈</h1>
        <div id="scoreCounter" class="score">점수: 0/10</div>
      </div>
      <div class="progress-wrap" aria-hidden="true">
        <div id="progressBar" class="progress-bar"></div>
      </div>
    </header>

    <section id="quizSection" class="content">
      <div id="questionMeta" class="meta"></div>
      <h2 id="questionText" class="question"></h2>
      <div id="answers" class="answers"></div>
      <div id="feedback" class="feedback"></div>
      <div class="next-row">
        <button id="nextBtn" class="next-btn" disabled>다음</button>
      </div>
    </section>

    <section id="resultSection" class="content results hidden">
      <h2>미션 완료!</h2>
      <div id="emojiReaction" class="emoji">🌍</div>
      <p id="finalScoreText" class="result-line"></p>
      <button id="restartBtn" class="restart-btn">다시 도전</button>
    </section>
  </main>

  <script>
    const quizData = [
      {
        question: "인류가 최초로 달에 착륙한 임무는 무엇일까요?",
        options: ["아폴로 11호", "보스토크 1호", "아르테미스 I", "제미니 4호"],
        answer: 0
      },
      {
        question: "태양계에서 가장 큰 행성은 무엇일까요?",
        options: ["토성", "목성", "해왕성", "지구"],
        answer: 1
      },
      {
        question: "‘창조의 기둥’ 같은 심우주 이미지를 가시광선으로 촬영한 망원경은 무엇일까요?",
        options: ["제임스 웹 우주망원경", "허블 우주망원경", "스피처 우주망원경", "찬드라 엑스선 관측소"],
        answer: 1
      },
      {
        question: "저궤도에서 우주비행사를 대부분의 유해한 태양 복사로부터 보호하는 것은 무엇일까요?",
        options: ["밴앨런대", "지구 자기권", "오존층", "소행성대"],
        answer: 1
      },
      {
        question: "2021년에 화성에 착륙해 큰 주목을 받은 로버는 무엇일까요?",
        options: ["큐리오시티", "스피릿", "퍼서비어런스", "오퍼튜니티"],
        answer: 2
      },
      {
        question: "광년은 무엇의 단위일까요?",
        options: ["밝기", "시간", "거리", "질량"],
        answer: 2
      },
      {
        question: "올림푸스 몬스(태양계 최대 화산)가 있는 행성은 무엇일까요?",
        options: ["금성", "화성", "수성", "목성"],
        answer: 1
      },
      {
        question: "인류 최초로 궤도에 올라간 인공위성은 무엇일까요?",
        options: ["스푸트니크 1호", "익스플로러 1호", "루나 2호", "보이저 1호"],
        answer: 0
      },
      {
        question: "태양의 에너지원은 무엇일까요?",
        options: ["화학 연소", "핵분열", "핵융합", "지열 가열"],
        answer: 2
      },
      {
        question: "인류를 달에 다시 보내기 위한 NASA의 프로그램 이름은 무엇일까요?",
        options: ["머큐리", "보이저", "아르테미스", "스카이랩"],
        answer: 2
      }
    ];

    const progressBar = document.getElementById("progressBar");
    const scoreCounter = document.getElementById("scoreCounter");
    const questionMeta = document.getElementById("questionMeta");
    const questionText = document.getElementById("questionText");
    const answersEl = document.getElementById("answers");
    const feedbackEl = document.getElementById("feedback");
    const nextBtn = document.getElementById("nextBtn");
    const quizSection = document.getElementById("quizSection");
    const resultSection = document.getElementById("resultSection");
    const emojiReaction = document.getElementById("emojiReaction");
    const finalScoreText = document.getElementById("finalScoreText");
    const restartBtn = document.getElementById("restartBtn");

    let currentIndex = 0;
    let score = 0;
    let answered = false;

    function setProgress() {
      const progress = (currentIndex / quizData.length) * 100;
      progressBar.style.width = `${progress}%`;
      scoreCounter.textContent = `점수: ${score}/${quizData.length}`;
    }

    function showQuestion() {
      answered = false;
      nextBtn.disabled = true;
      feedbackEl.textContent = "";
      feedbackEl.className = "feedback";
      answersEl.innerHTML = "";

      const item = quizData[currentIndex];
      questionMeta.textContent = `문제 ${currentIndex + 1} / ${quizData.length}`;
      questionText.textContent = item.question;

      item.options.forEach((option, index) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "answer-btn";
        btn.textContent = option;
        btn.addEventListener("click", () => selectAnswer(btn, index));
        answersEl.appendChild(btn);
      });

      setProgress();
    }

    function selectAnswer(clickedBtn, selectedIndex) {
      if (answered) return;
      answered = true;

      const item = quizData[currentIndex];
      const buttons = Array.from(document.querySelectorAll(".answer-btn"));
      const isCorrect = selectedIndex === item.answer;

      buttons.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === item.answer) btn.classList.add("correct");
      });

      if (isCorrect) {
        score += 1;
        feedbackEl.textContent = "✅ 정답입니다! 우주 항해가 아주 훌륭해요.";
        feedbackEl.classList.add("correct");
      } else {
        clickedBtn.classList.add("wrong");
        feedbackEl.textContent = "❌ 아쉬워요! 강조된 선택지가 정답이에요.";
        feedbackEl.classList.add("wrong");
      }

      scoreCounter.textContent = `점수: ${score}/${quizData.length}`;
      nextBtn.disabled = false;
    }

    function getEmoji(scoreValue) {
      const ratio = scoreValue / quizData.length;
      if (ratio === 1) return "🏆🚀";
      if (ratio >= 0.8) return "🌟";
      if (ratio >= 0.6) return "😄";
      if (ratio >= 0.4) return "🙂";
      return "🛰️";
    }

    function showResults() {
      quizSection.classList.add("hidden");
      resultSection.classList.remove("hidden");
      progressBar.style.width = "100%";
      emojiReaction.textContent = getEmoji(score);
      finalScoreText.textContent = `총 ${quizData.length}문제 중 ${score}문제를 맞혔어요.`;
    }

    nextBtn.addEventListener("click", () => {
      currentIndex += 1;
      if (currentIndex >= quizData.length) {
        showResults();
      } else {
        showQuestion();
      }
    });

    restartBtn.addEventListener("click", () => {
      currentIndex = 0;
      score = 0;
      resultSection.classList.add("hidden");
      quizSection.classList.remove("hidden");
      showQuestion();
    });

    showQuestion();
  </script>
</body>
</html>
